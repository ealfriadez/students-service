version: "3.8"

services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:

      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: students_db

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "80:80"
    depends_on:
      - postgres

  students-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: students-service:v5
    container_name: students-service
    depends_on:
      - postgres
    environment:
      DB_HOST: jdbc:postgresql://postgres:5432/students_db
      DB_USER: root
      DB_PASSWORD: root
      COURSES_URL: http://courses-service:9090
    ports:
      - "8090:8090"

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: courses_db
    ports:
      - "3306:3306"

  courses-service:
    image: ealfriadez/courses-service:v5
    container_name: courses-service
    depends_on:
      - mysql
    environment:
      DB_HOST: jdbc:mysql://mysql:3306/courses_db
      DB_USER: root
      DB_PASSWORD: root
      STUDENTS_URL: http://students-service:8090
    ports:
      - "9090:9090"

  authorization-server:
    image: ealfriadez/authorization-server:v5
    container_name: authorization-server
    environment:
      CLIENT_URL: http://gateway-server:9080
    ports:
      - "9070:9070"

  gateway-server:
    image: ealfriadez/gateway-server:v5
    container_name: gateway-server
    depends_on:
      - students-service
      - courses-service
      - authorization-server
    environment:
      STUDENTS_URL: http://students-service:8090/students
      COURSES_URL: http://courses-service:9090/courses
      AUTH_SERVER: http://authorization-server:9070
      REDIRECT_URL: http://gateway-server:9080/authorized
    ports:
      - "9080:9080"